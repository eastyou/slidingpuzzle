[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "slidingpuzzle"
version = "0.1.0"
description = "数字华容道：可解性判定、可复现洗牌与可打印棋盘"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "eastyou" }]
keywords = ["sliding-puzzle", "puzzle", "printable", "classroom", "teacher", "cli"]
classifiers = [
  "Programming Language :: Python :: 3",
  "License :: OSI Approved :: MIT License",
  "Operating System :: OS Independent",
  "Environment :: Console",
  "Topic :: Education",
]

[project.scripts]
slidingpuzzle = "slidingpuzzle.cli:main"

[project.urls]
Homepage = "https://github.com/eastyou/slidingpuzzle"
Source = "https://github.com/eastyou/slidingpuzzle"

[tool.setuptools]
packages = ["slidingpuzzle"]
